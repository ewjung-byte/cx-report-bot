name: CX Daily Report

on:
  # GitHub Actions cron은 지연 발화로 야간/오후 발송 사고 발생(2026-05-19 KST 21:21).
  # GAS 시간 트리거(triggerDailyReport, 매일 오전 9시대 KST)가 단일 정시 호출 경로.
  workflow_dispatch:       # GAS·수동에서만 실행
    inputs:
      mode:
        description: 'Report mode (daily/weekly, empty = auto by weekday)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run CX Report
        run: node report.js ${{ inputs.mode }}
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          CAFE24_CLIENT_SECRET: ${{ secrets.CAFE24_CLIENT_SECRET }}
          CAFE24_TOKEN_DRIVE_FILE_ID: ${{ secrets.CAFE24_TOKEN_DRIVE_FILE_ID }}
          META_ACCESS_TOKEN:    ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT:      ${{ secrets.META_AD_ACCOUNT }}
          TG_BOT_TOKEN:         ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID:           ${{ secrets.TG_CHAT_ID }}
          TG_GROUP_CHAT_ID:     ${{ secrets.TG_GROUP_CHAT_ID }}
          CLAUDE_API_KEY:       ${{ secrets.CLAUDE_API_KEY }}
          CLAUDE_MODEL:         ${{ secrets.CLAUDE_MODEL }}
          CLARITY_TOKEN:        ${{ secrets.CLARITY_TOKEN }}
          GA4_CLIENT_ID:        ${{ secrets.GA4_CLIENT_ID }}
          GA4_CLIENT_SECRET:    ${{ secrets.GA4_CLIENT_SECRET }}
          GA4_REFRESH_TOKEN:    ${{ secrets.GA4_REFRESH_TOKEN }}
          GA4_PROPERTY_ID:      ${{ secrets.GA4_PROPERTY_ID }}
          TELEGRAM_API_ID:      ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH:    ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_USER_SESSION: ${{ secrets.TELEGRAM_USER_SESSION }}
          SOLAPI_API_KEY:       ${{ secrets.SOLAPI_API_KEY }}
          SOLAPI_API_SECRET:    ${{ secrets.SOLAPI_API_SECRET }}

      - name: Save bot state
        if: always()
        run: |
          git config user.name "cx-bot"
          git config user.email "bot@songmamans.com"
          git add -f reminders.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: update bot state [skip ci]"
          git push || true
